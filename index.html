<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nvnssr · скоро открытие</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Анимированный фон -->
  <div class="bg"></div>

  <div class="container">
    <div class="content">
      <!-- Логотип / бейдж -->
      <div class="badge">✦ nvnssr</div>

      <!-- Заголовок -->
      <h1>скоро<br />открытие</h1>

      <!-- Подзаголовок -->
      <p class="sub">
        мы готовим для вас<br />
        <span>что‑то особенное</span>
      </p>

      <!-- Разделитель -->
      <div class="divider"></div>

      <!-- Таймер -->
      <div class="timer">
        <div class="timer-item">
          <span class="num" id="days">00</span>
          <span class="label">дней</span>
        </div>
        <div class="timer-item">
          <span class="num" id="hours">00</span>
          <span class="label">часов</span>
        </div>
        <div class="timer-item">
          <span class="num" id="minutes">00</span>
          <span class="label">минут</span>
        </div>
        <div class="timer-item">
          <span class="num" id="seconds">00</span>
          <span class="label">секунд</span>
        </div>
      </div>

      <!-- Статус -->
      <div class="status">
        <span class="dot"></span>
        <span>следите за обновлениями</span>
      </div>

      <!-- Футер -->
      <div class="footer">nvnssr · 2026</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
