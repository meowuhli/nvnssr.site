<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nvnssr · скоро</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="background">
    <div class="gradient"></div>
    <div class="particles"></div>
  </div>

  <div class="container">
    <div class="badge">✦ soon</div>
    <h1>скоро...</h1>
    <p class="sub">что-то удивительное уже в пути</p>
    <div class="line"></div>
    <div class="status">
      <span class="dot"></span>
      <span>nvnssr · 2026</span>
    </div>
  </div>

  <script>
    // частицы (яркие точки)
    const particles = document.querySelector('.particles');
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.width = p.style.height = Math.random() * 6 + 2 + 'px';
      p.style.animationDuration = 4 + Math.random() * 6 + 's';
      p.style.animationDelay = Math.random() * 5 + 's';
      const colors = ['#a78bfa', '#7c3aed', '#60a5fa', '#f472b6', '#34d399'];
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      particles.appendChild(p);
    }
  </script>
</body>
</html>
