<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nvnssr · скоро</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg"></div>

  <div class="container">
    <div class="content">
      <div class="badge">✦ nvnssr</div>

      <!-- Заголовок убран -->

      <p class="sub">мы готовим для вас<br /><span>что‑то особенное</span></p>
      <div class="divider"></div>

      <div class="timer">
        <div class="timer-item">
          <span class="num" id="days">00</span>
          <span class="label">дней</span>
        </div>
        <div class="timer-item">
          <span class="num" id="hours">00</span>
          <span class="label">часов</span>
        </div>
        <div class="timer-item">
          <span class="num" id="minutes">00</span>
          <span class="label">минут</span>
        </div>
        <div class="timer-item">
          <span class="num" id="seconds">00</span>
          <span class="label">секунд</span>
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        <span>следите за обновлениями</span>
      </div>
      <div class="footer">nvnssr · 2026</div>
    </div>
  </div>

  <script>
    const launchDate = new Date(2026, 9, 13, 0, 0).getTime();
    function updateTimer() {
      const now = Date.now();
      let diff = launchDate - now;
      if (diff < 0) diff = 0;
      document.getElementById('days').textContent = String(Math.floor(diff / (1000*60*60*24))).padStart(2, '0');
      document.getElementById('hours').textContent = String(Math.floor((diff % (1000*60*60*24)) / (1000*60*60))).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor((diff % (1000*60*60)) / (1000*60))).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor((diff % (1000*60)) / 1000)).padStart(2, '0');
    }
    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
